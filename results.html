<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نتائج الاستبيان – ملخصات أبو عماد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=7">
<link rel="stylesheet" href="results.css?v=8">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <h1>نتائج الاستبيان</h1>
    <p>الحقوق – المستوى الأول · الردود والإحصائيات</p>
  </header>

  <section class="section" id="loginBox">
    <form class="login" id="loginForm">
      <label for="key" style="font-weight:700">كلمة مرور النتائج</label>
      <input type="password" id="key" autocomplete="current-password" required>
      <button class="btn" type="submit">عرض الردود</button>
      <div id="loginErr" class="notice error" hidden></div>
    </form>
  </section>

  <div id="dash" hidden style="display:flex;flex-direction:column;gap:18px">
    <div class="toolbar">
      <button class="btn" id="refresh" type="button">تحديث</button>
      <button class="btn ghost" id="logout" type="button">خروج</button>
      <span class="updated" id="updated"></span>
    </div>
    <div class="filters" id="filters" role="group" aria-label="تصفية حسب المادة"></div>
    <div class="tiles" id="tiles"></div>
    <div id="charts" style="display:flex;flex-direction:column;gap:18px"></div>
  </div>
</main>

<script src="questions.js?v=7"></script>
<script src="results.js?v=8"></script>
</body>
</html>
